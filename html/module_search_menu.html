<text-field id="module-search-input"></text-field>
<span id="module-search-validation-message" style="visibility: hidden; color: red; font-weight: bold; font-size: 120%;">!</span>
<button id="start-module-search-button" class="fg-button ui-corner-all ui-state-default" i18n="search-menu.search"></button>
<div style="margin-top: 1em;">
  <select id="search-type" style="margin-right: 1em; margin-bottom: 1em;">
    <option value="phrase" i18n="search-menu.exact-phrase"></option>
    <option value="multiWord" i18n="search-menu.multi-word"></option>
    <option value="strongsNumber" i18n="search-menu.strongs"></option>
  </select>

  <select id="search-scope" style="margin-right: 1em; margin-bottom: 1em;">
      <option value="BIBLE" i18n="search-menu.whole-bible"></option>
      <option value="OT" i18n="search-menu.ot"></option>
      <option value="NT" i18n="search-menu.nt"></option>
      <option value="CURRENT_BOOK" i18n="search-menu.current-book" hidden disabled></option>
  </select>

  <select id="search-results-display-mode">
    <option value="popup" i18n="search-menu.open-in-popup"></option>
    <option value="current-tab" i18n="search-menu.open-in-current-tab" selected></option>
    <option value="new-tab" i18n="search-menu.open-in-new-tab"></option>
  </select>
  <div id="current-book-search-scope-container" style="display: none; margin-top: 0.8em;">
    <span i18n="search-menu.current-book-name"></span>:
    <span id="current-book-search-scope" class="current-book-search-scope-book"></span>
  </div>
</div>
<div style="margin-top: 1em;">
  <input type="checkbox" id="search-is-case-sensitive">
  <label for="search-is-case-sensitive" i18n="search-menu.case-sensitive"></label>
</div>
<div style="margin-top: 1em;">
  <input type="checkbox" id="search-word-boundaries">
  <label for="search-word-boundaries" i18n="search-menu.word-boundaries"></label>
</div>
<div style="margin-top: 1em;">
  <input type="checkbox" id="search-extended-verse-boundaries">
  <label for="search-extended-verse-boundaries" i18n="search-menu.extended-verse-boundaries"></label>
</div>
